<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Well Done Card</title>

<!-- iOS: makes the page installable via Add to Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Well Done Card">

<!-- Android/Chrome theme + PWA manifest -->
<meta name="theme-color" content="#AD8A4E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Well%20Done%20Card%22%2C%22short_name%22%3A%22Well%20Done%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f4f2ee%22%2C%22theme_color%22%3A%22%23AD8A4E%22%7D">

<!-- Home screen icon (gold circle with J) for both platforms -->
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='20'%20fill='%23AD8A4E'/%3E%3Ctext%20x='50'%20y='68'%20font-size='55'%20font-family='Georgia,serif'%20font-weight='bold'%20fill='white'%20text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='20'%20fill='%23AD8A4E'/%3E%3Ctext%20x='50'%20y='68'%20font-size='55'%20font-family='Georgia,serif'%20font-weight='bold'%20fill='white'%20text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --gold:#AD8A4E;
    --gold-dark:#8F6F38;
    --card-bg:#ffffff;
    --ink:#2b2620;
    --line:#C9B98A;
    --bg:#f4f2ee;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:16px;
  }
  h1{
    font-size:18px;
    margin:0 0 4px 0;
    color:var(--gold-dark);
  }
  p.sub{
    margin:0 0 18px 0;
    font-size:13px;
    color:#666;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
  }
  .panel{
    background:#fff;
    border-radius:14px;
    padding:16px;
    box-shadow:0 1px 4px rgba(0,0,0,0.08);
    margin-bottom:18px;
  }
  label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--gold-dark);
    margin:12px 0 4px 0;
  }
  label:first-child{margin-top:0;}
  select, input[type="date"], textarea{
    width:100%;
    padding:10px 10px;
    font-size:14px;
    border:1px solid #ddd;
    border-radius:8px;
    background:#fafafa;
    color:var(--ink);
    font-family:inherit;
  }
  textarea{
    resize:vertical;
    min-height:90px;
    line-height:1.4;
  }
  .readonly{
    background:#f0eee8;
    color:#555;
    padding:10px;
    border-radius:8px;
    font-size:14px;
    border:1px solid #e5e0d3;
    min-height:20px;
  }
  .btn{
    width:100%;
    padding:13px;
    font-size:15px;
    font-weight:700;
    border:none;
    border-radius:10px;
    background:var(--gold);
    color:#fff;
    cursor:pointer;
    margin-top:6px;
  }
  .btn:active{background:var(--gold-dark);}
  .btn:disabled{background:#ccc;cursor:not-allowed;}
  .hint{
    font-size:11.5px;
    color:#888;
    margin-top:4px;
  }

  /* ---- CARD PREVIEW ---- */
  .stage{
    display:flex;
    justify-content:center;
    margin-bottom:16px;
  }
  .frame{
    width:100%;
    max-width:480px;
    aspect-ratio:1/1.02;
    background:var(--gold);
    border-radius:22px;
    padding:22px;
  }
  .card{
    position:relative;
    background:var(--card-bg);
    border-radius:16px;
    width:100%;
    height:100%;
    padding:26px 26px 22px 26px;
    display:flex;
    flex-direction:column;
  }
  .card-inner-border{
    position:absolute;
    top:8px; left:8px; right:8px; bottom:8px;
    border:1px solid var(--gold);
    border-radius:12px;
    pointer-events:none;
  }
  .row-label{
    font-size: clamp(13px, 3.6vw, 16px);
    font-weight:700;
    color:var(--gold-dark);
  }
  .row-value{
    font-weight:400;
    color:var(--ink);
  }
  .field-name{ margin-bottom:8px; }
  .field-id-date{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
  }
  .wd-header{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
  }
  .thumb-circle{
    width: clamp(24px,6vw,30px);
    height: clamp(24px,6vw,30px);
    border-radius:50%;
    background:var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .thumb-circle svg{
    width:58%;
    height:58%;
    fill:#fff;
  }
  .lines{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    gap: clamp(10px, 3vw, 16px);
    margin-bottom:14px;
  }
  .line{
    border-bottom:1px solid var(--line);
    min-height: clamp(20px, 4.5vw, 26px);
    display:flex;
    align-items:flex-end;
    padding-bottom:2px;
    font-size: clamp(12px, 3vw, 15px);
    color:var(--ink);
    overflow:hidden;
    white-space:nowrap;
  }
  .bottom-fields{
    margin-top:auto;
  }
  .field-simple{
    margin-bottom:6px;
  }
  .logo-j{
    position:absolute;
    bottom:16px;
    right:16px;
    width: clamp(30px,7vw,38px);
    height: clamp(30px,7vw,38px);
    border-radius:50%;
    background:var(--gold);
    color:#fff;
    font-weight:800;
    font-size: clamp(16px,4vw,20px);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Georgia, serif;
  }

  @media (min-width:600px){
    .wrap{max-width:900px;}
    .layout{display:flex; gap:24px; align-items:flex-start;}
    .layout .panel{flex:1; max-width:380px;}
    .layout .stage{flex:1; margin-bottom:0;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Well Done Card Generator</h1>
  <p class="sub">Fill in the details below — the card preview updates automatically.</p>

  <div class="layout">
    <div class="panel">
      <label for="empId">Employee ID</label>
      <select id="empId">
        <option value="">-- Select Employee ID --</option>
      </select>

      <label>Employee Name</label>
      <div class="readonly" id="empNameDisplay">Auto-filled from Employee ID</div>

      <label for="dateInput">Date</label>
      <input type="date" id="dateInput">

      <label for="positionSelect">Position</label>
      <select id="positionSelect">
        <option value="">-- Select Position --</option>
      </select>

      <label for="achievementSelect">Well Done for:</label>
      <select id="achievementSelect" disabled>
        <option value="">-- Select Position First --</option>
      </select>
      <div id="customWrap" style="display:none;">
        <label for="customText">Type the achievement</label>
        <textarea id="customText" maxlength="160" placeholder="Type the achievement here..."></textarea>
      </div>
      <div class="hint" id="lineHint">Choose the position, then pick the matching achievement.</div>

      <label>Name (Manager)</label>
      <div class="readonly">Richard Samaan</div>

      <button class="btn" id="downloadBtn">Download Card as Image</button>
    </div>

    <div class="stage">
      <div class="frame">
        <div class="card" id="cardCapture">
          <div class="card-inner-border"></div>

          <div class="field-name">
            <span class="row-label">Employee Name: </span><span class="row-value" id="pvName"></span>
          </div>
          <div class="field-id-date">
            <div><span class="row-label">Employee ID: </span><span class="row-value" id="pvId"></span></div>
            <div><span class="row-label">Date: </span><span class="row-value" id="pvDate"></span></div>
          </div>

          <div class="wd-header">
            <div class="thumb-circle">
              <svg viewBox="0 0 24 24"><path d="M2 21h2c.55 0 1-.45 1-1v-9c0-.55-.45-1-1-1H2v11zM22.83 11.17c.11-.25.17-.52.17-.8V9c0-1.1-.9-2-2-2h-5.5l.92-4.65c.05-.22.02-.46-.08-.66a1.007 1.007 0 0 0-1.28-.45L14 1.83 8.5 7.33c-.32.32-.5.76-.5 1.21V19c0 1.1.9 2 2 2h8c.8 0 1.52-.48 1.84-1.21l2.99-6.98c.06-.15.09-.31.09-.47v-1.17z"/></svg>
            </div>
            <span class="row-label">Well Done for:</span>
          </div>

          <div class="lines" id="pvLines">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
          </div>

          <div class="bottom-fields">
            <div class="field-simple"><span class="row-label">Name: </span><span class="row-value">Richard Samaan</span></div>
            <div class="field-simple"><span class="row-label">Signature: </span></div>
          </div>

          <div class="logo-j">J</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const employees = {
  "BH0591": "Dima Danoun",
  "BH0432": "Mohamed Nabil Elhaddad",
  "BH0586": "Mriem Abdulkareem Bejaoui",
  "BH0552": "Rafiqul Islam",
  "BH0058": "Sandy Garcia Bodoso"
};

const positionOptions = {
  "Tailor": [
    "Completing alterations and delivering them on the same day. (Urgent)",
    "Completing 5 items alteration in one day.",
    "Completing 2 suits full alteration in one day.",
    "Completing 1 suit and 3 additional items in one day.",
    "Receiving a 5 star Google review.",
    "Volunteered during my off day to assist the sales floor and support sales growth.",
    "Supporting a colleague with a sale and customer service. This Well Done Card issued upon the colleague's recommendation."
  ],
  "Sales Associate": [
    "Achieving the daily sales target of BD 700 and above.",
    "Receiving a 5 star customer review.",
    "Completing a sale through WhatsApp.",
    "Saved a sale through stock sourcing from Al A'Ali Mall, driving sales and customer satisfaction.",
    "Completing a bulk transaction with a value above BD 500.",
    "Collecting 3 customer contacts in one day for CRM and sharing details in the VIP group.",
    "Volunteering to support the sales floor for half a day and helping drive sales.",
    "Supporting a colleague with a sale and customer service. This Well Done Card issued upon the colleague's recommendation."
  ]
};

const empIdSelect = document.getElementById('empId');
Object.keys(employees).forEach(id=>{
  const opt = document.createElement('option');
  opt.value = id;
  opt.textContent = id + " — " + employees[id];
  empIdSelect.appendChild(opt);
});

const positionSelect = document.getElementById('positionSelect');
Object.keys(positionOptions).forEach(pos=>{
  const opt = document.createElement('option');
  opt.value = pos;
  opt.textContent = pos;
  positionSelect.appendChild(opt);
});

const achievementSelect = document.getElementById('achievementSelect');

positionSelect.addEventListener('change', ()=>{
  const pos = positionSelect.value;
  achievementSelect.innerHTML = "";
  if(!pos){
    achievementSelect.disabled = true;
    const opt = document.createElement('option');
    opt.value = "";
    opt.textContent = "-- Select Position First --";
    achievementSelect.appendChild(opt);
  } else {
    achievementSelect.disabled = false;
    const placeholder = document.createElement('option');
    placeholder.value = "";
    placeholder.textContent = "-- Select Achievement --";
    achievementSelect.appendChild(placeholder);
    positionOptions[pos].forEach(text=>{
      const opt = document.createElement('option');
      opt.value = text;
      opt.textContent = text;
      achievementSelect.appendChild(opt);
    });
    const customOpt = document.createElement('option');
    customOpt.value = "__custom__";
    customOpt.textContent = "Other (type your own)";
    achievementSelect.appendChild(customOpt);
  }
  document.getElementById('customWrap').style.display = "none";
  document.getElementById('customText').value = "";
  updatePreview();
});

const empNameDisplay = document.getElementById('empNameDisplay');
const dateInput = document.getElementById('dateInput');
const pvName = document.getElementById('pvName');
const pvId = document.getElementById('pvId');
const pvDate = document.getElementById('pvDate');
const pvLines = document.getElementById('pvLines').children;

// default date = today
const today = new Date();
dateInput.value = today.toISOString().slice(0,10);

function formatDate(isoStr){
  if(!isoStr) return "";
  const d = new Date(isoStr + "T00:00:00");
  const day = String(d.getDate()).padStart(2,'0');
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${day} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

// simple word-wrap into up to 6 lines based on approx char width
function wrapText(text, maxLines){
  const maxCharsPerLine = 40;
  const words = text.trim().split(/\s+/).filter(Boolean);
  const lines = [];
  let current = "";
  for(const w of words){
    const test = current ? current + " " + w : w;
    if(test.length > maxCharsPerLine){
      if(current) lines.push(current);
      current = w;
      if(lines.length >= maxLines) break;
    } else {
      current = test;
    }
  }
  if(current && lines.length < maxLines) lines.push(current);
  return lines.slice(0, maxLines);
}

function getAchievementText(){
  if(achievementSelect.value === "__custom__"){
    return document.getElementById('customText').value;
  }
  return achievementSelect.value;
}

function updatePreview(){
  const id = empIdSelect.value;
  const name = employees[id] || "";
  empNameDisplay.textContent = name || "Auto-filled from Employee ID";
  pvName.textContent = name;
  pvId.textContent = id;
  pvDate.textContent = formatDate(dateInput.value);

  const lines = wrapText(getAchievementText(), 6);
  for(let i=0;i<pvLines.length;i++){
    if(lines[i]){
      pvLines[i].textContent = lines[i];
      pvLines[i].style.display = "";
    } else {
      pvLines[i].textContent = "";
      pvLines[i].style.display = "none";
    }
  }
}

empIdSelect.addEventListener('change', updatePreview);
dateInput.addEventListener('change', updatePreview);
achievementSelect.addEventListener('change', ()=>{
  const customWrap = document.getElementById('customWrap');
  if(achievementSelect.value === "__custom__"){
    customWrap.style.display = "block";
  } else {
    customWrap.style.display = "none";
  }
  updatePreview();
});
document.getElementById('customText').addEventListener('input', updatePreview);

updatePreview();

document.getElementById('downloadBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('downloadBtn');
  if(!empIdSelect.value){
    alert("Please select an Employee ID first.");
    return;
  }
  if(!achievementSelect.value){
    alert("Please select a position and an achievement first.");
    return;
  }
  if(achievementSelect.value === "__custom__" && !document.getElementById('customText').value.trim()){
    alert("Please type the achievement in the text box first.");
    return;
  }
  btn.disabled = true;
  btn.textContent = "Generating...";
  try{
    const frame = document.querySelector('.frame');
    const canvas = await html2canvas(frame, {
      scale: 3,
      backgroundColor: null,
      useCORS: true
    });
    const link = document.createElement('a');
    const safeName = (employees[empIdSelect.value]||"employee").replace(/\s+/g,'_');
    link.download = `WellDone_${empIdSelect.value}_${safeName}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }catch(e){
    alert("Something went wrong generating the image. Please try again.");
    console.error(e);
  }
  btn.disabled = false;
  btn.textContent = "Download Card as Image";
});
</script>
</body>
</html>
